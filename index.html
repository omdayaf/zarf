<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ظرف</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ظرف">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A1424">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A1424;--card:#121F36;--ink:#F5F1E6;--mute:#B9C2D6;--dim:#8F9BB3;--line:rgba(255,255,255,.08);--gold:#D4AF37;--gold2:#F0D78A;--green:#3DDC97;--red:#FF6B6B;--amber:#F0B429}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:Cairo,system-ui,sans-serif;font-size:15px;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button{font-family:inherit;color:inherit}
.top{padding:calc(16px + env(safe-area-inset-top)) 20px 4px;display:flex;align-items:center;gap:12px;max-width:520px;margin:0 auto}
.top .t{flex-grow:1}.top .k{font-size:12px;color:var(--gold);font-weight:700}.top .d{font-size:22px;font-weight:800;margin-top:2px}
.logo{font-family:'Reem Kufi',Cairo;font-weight:700;font-size:28px;color:var(--ink)}
main{padding:12px 20px;display:flex;flex-direction:column;gap:14px;max-width:520px;margin:0 auto}
.hero{background:linear-gradient(150deg,#1D2D4E 0%,#101C33 70%);border:1px solid rgba(212,175,55,.4);border-radius:24px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.hero .l{font-size:13px;color:var(--mute);font-weight:600}
.hero .big{font-size:54px;font-weight:800;line-height:1}.hero .cur{font-size:16px;font-weight:700;color:var(--gold);margin-inline-start:8px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.p1{font-size:12px;font-weight:700;color:var(--gold);border:1px solid rgba(212,175,55,.5);border-radius:999px;padding:3px 12px}
.p2{font-size:12px;font-weight:600;color:var(--mute);background:rgba(255,255,255,.07);border-radius:999px;padding:3px 12px}
.track{height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}.track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.sub{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.sec{display:flex;align-items:center;justify-content:space-between}.sec b{font-size:16px;font-weight:800}
.env{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;gap:8px;width:100%;text-align:right;cursor:pointer}
.env .r{display:flex;align-items:center;gap:8px}.env .n{font-weight:700;font-size:15px;flex-grow:1}
.chip{font-size:11px;color:var(--mute);background:rgba(255,255,255,.07);border-radius:999px;padding:2px 10px}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px}
.banner{background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.45);border-radius:18px;padding:10px 14px;font-size:14px}
.banner.red{background:rgba(255,107,107,.1);border-color:rgba(255,107,107,.5)}
nav{position:fixed;bottom:0;left:0;right:0;height:calc(84px + env(safe-area-inset-bottom));background:rgba(10,20,36,.97);border-top:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-around;padding:10px 6px 0}
nav button.n{background:none;border:0;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;font-size:11px;font-weight:600;cursor:pointer}
nav button.n.on{color:var(--gold);font-weight:700}
nav .plus{width:66px;height:66px;margin-top:-30px;border-radius:50%;border:4px solid var(--bg);background:linear-gradient(145deg,var(--gold2),var(--gold));color:var(--bg);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(212,175,55,.45);cursor:pointer}
.pay{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column;gap:12px;padding:calc(16px + env(safe-area-inset-top)) 20px calc(16px + env(safe-area-inset-bottom));overflow:auto}
.pay.on{display:flex}.pay .in{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.ph{display:flex;align-items:center;gap:12px;height:44px}
.x{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0}
.cp{flex:none;height:40px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;background:var(--card);color:var(--mute);border:1px solid rgba(255,255,255,.1)}
.cp.on{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.amt{display:flex;flex-direction:column;align-items:center;padding:6px 0 2px}.amt .a{font-size:76px;font-weight:800;line-height:1.05;direction:ltr}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.box .rw{display:flex;justify-content:space-between;align-items:center}
.acc{background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.45);border-radius:18px;padding:10px 14px;display:flex;align-items:center;gap:12px}
.acc .ic{width:40px;height:40px;border-radius:12px;background:rgba(212,175,55,.18);color:var(--gold);display:flex;align-items:center;justify-content:center}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;direction:ltr}
.keys button{height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:22px;font-weight:700;cursor:pointer}
.go{height:56px;border-radius:18px;border:0;background:linear-gradient(145deg,var(--gold2),var(--gold));color:var(--bg);font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 8px 22px rgba(212,175,55,.35);width:100%}
.go:disabled{opacity:.6}
.note{width:100%;font:inherit;font-size:15px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:14px;padding:10px 14px;cursor:pointer}
.opt.sel{border-color:var(--gold);background:rgba(212,175,55,.12)}
.warn{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.5);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.tx{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}.tx b{flex-grow:1}
.ghost{height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:transparent;width:100%;font-size:15px;font-weight:700;cursor:pointer}
.toast{position:fixed;left:20px;right:20px;bottom:calc(104px + env(safe-area-inset-bottom));background:#1D2D4E;border:1px solid rgba(212,175,55,.5);border-radius:14px;padding:12px 16px;display:none;z-index:30;text-align:center}
.toast.on{display:block}
</style>
</head>
<body>
<div class="top"><div class="t"><div class="k" id="k"></div><div class="d" id="d"></div></div><span class="logo">ظرف</span></div>
<main id="main"></main>
<nav>
  <button class="n on" id="t-home" onclick="tab('home')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>الرئيسية</button>
  <button class="n" id="t-log" onclick="tab('log')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>السجل</button>
  <button class="plus" aria-label="قبل ما أدفع" onclick="openPay()"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="n" id="t-rep" onclick="tab('rep')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>التقارير</button>
  <button class="n" id="t-more" onclick="tab('more')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>المزيد</button>
</nav>

<div class="pay" id="pay"><div class="in" id="payin"></div></div>
<div class="toast" id="toast"></div>

<script>
var API = 'https://script.google.com/macros/s/AKfycbwBRzr9kc4mm76XAjG6wqE4E7_gwuXB_BJgP9m_6OzZ5-K3RsurtdBbTIM55QbqThooIQ/exec';
var $ = function (id) { return document.getElementById(id); };
var state = null, recent = [], view = 'home';
var token = lsGet('zarf_token');

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function fmt(n) { return Math.round(Number(n) || 0).toLocaleString('en-US'); }
function toast(t) { var e = $('toast'); e.textContent = t; e.classList.add('on'); setTimeout(function () { e.classList.remove('on'); }, 2600); }
function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }

function get(action, extra) { return fetch(API + '?action=' + action + '&token=' + encodeURIComponent(token) + (extra || '')).then(function (r) { return r.json(); }); }
function post(body) { body.token = token; return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }).then(function (r) { return r.json(); }); }

/* طابور بدون إنترنت */
function queue() { try { return JSON.parse(lsGet('zarf_q') || '[]'); } catch (e) { return []; } }
function saveQ(q) { lsSet('zarf_q', JSON.stringify(q)); }
function flush() {
  var q = queue();
  if (!q.length || !navigator.onLine) return Promise.resolve();
  var item = q[0];
  return post(JSON.parse(JSON.stringify(item))).then(function (res) {
    q.shift(); saveQ(q);
    if (res && res.ok) toast('تم رفع عملية محفوظة');
    return flush();
  }).catch(function () {});
}

function load() {
  if (!token) return setup();
  var cached = lsGet('zarf_state');
  if (cached && !state) { try { state = JSON.parse(cached); render(); } catch (e) {} }
  flush().then(function () { return get('state'); }).then(function (r) {
    if (!r.ok) { if (r.error === 'غير مصرح') { token = null; lsSet('zarf_token', ''); return setup(); } throw new Error(r.error); }
    state = r.data; lsSet('zarf_state', JSON.stringify(state)); render();
  }).catch(function () { if (state) { render(true); } else { $('main').innerHTML = '<div class="warn">تعذّر الاتصال. تأكد من الإنترنت.</div>'; } });
}
function setup() {
  $('main').innerHTML = '<div class="hero"><div class="sec"><b>أول مرة</b></div><div class="l">الصق الرمز السري الذي أنشأته من Apps Script.</div><input id="tk" class="note" placeholder="الرمز السري" style="direction:ltr;text-align:left"><button class="go" onclick="saveToken()">حفظ</button></div>';
}
function saveToken() { token = $('tk').value.trim(); if (!token) return; lsSet('zarf_token', token); load(); }

function tab(v) {
  view = v;
  ['home', 'log', 'rep', 'more'].forEach(function (x) { $('t-' + x).classList.toggle('on', x === v || (x === 'more' && (v === 'payday' || v === 'recon'))); });
  if (v === 'rep') { get('report').then(function (r) { rep = r.ok ? r.data : null; render(); }).catch(function () { render(); }); }
  if (v === 'payday') { get('payday').then(function (r) { payday = r.ok ? r.data : []; render(); }).catch(function () { render(); }); }
  if (v === 'recon') { get('accounts').then(function (r) { accs = r.ok ? r.data : []; render(); }).catch(function () { render(); }); }
  if (v === 'log') { get('recent', '&n=30').then(function (r) { recent = r.ok ? r.data : []; render(); }).catch(function () { render(); }); }
  render();
}
function color(e) { if (e.left < 0) return 'var(--red)'; if (e.pct >= 0.9) return 'var(--amber)'; return 'var(--green)'; }
function idx(name) { for (var i = 0; i < state.envelopes.length; i++) if (state.envelopes[i].name === name) return i; return -1; }

function render(offline) {
  if (!state) return;
  $('k').textContent = 'الدورة الحالية · باقي ' + state.daysLeft + ' يوم';
  $('d').textContent = state.cycleStart + ' ← ' + state.cycleEnd;
  var h = '';
  if (view === 'home') {
    var dd = state.daysSinceEntry;
    if (offline) h += '<div class="banner">أنت بدون اتصال. الأرقام من آخر تحديث.</div>';
    if (dd != null && dd >= 3) h += '<div class="banner red">ما سجلت من ' + dd + ' أيام. الأرقام تقريبية. دقيقة وحدة تلحق.</div>';
    else if (dd != null && dd >= 2) h += '<div class="banner">ما سجلت من يومين. تقدر تلحق بدقيقة؟</div>';
    var approx = dd != null && dd >= 3 ? '≈ ' : '';
    if (state.daysLeft <= 7) {
      var lw = '<div class="hero" style="border-color:rgba(240,180,41,.6)"><div class="l">آخر أسبوع قبل الراتب · باقي ' + state.daysLeft + ' يوم</div>';
      var over = 0;
      state.envelopes.forEach(function (e) {
        if (e.type !== 'متغير') return;
        if (e.left < 0) over++;
        lw += '<div class="rw" style="display:flex;justify-content:space-between;font-size:14px"><span>' + esc(e.name) + '</span><b style="color:' + (e.left < 0 ? 'var(--red)' : 'var(--green)') + '">' + fmt(e.left) + '</b></div>';
      });
      lw += '<div style="font-size:13px;color:var(--mute)">' + (over ? 'عندك ' + over + ' ظرف تجاوز ميزانيته. تتسوّى من الاستلاف يوم الراتب.' : 'كل الأظرف سليمة. الباقي يروح لك أو للادخار حسب قرارك.') + '</div></div>';
      h += lw;
    }
    var vars = state.envelopes.filter(function (e) { return e.type === 'متغير'; });
    var tb = 0, ts = 0; vars.forEach(function (e) { tb += e.budget; ts += e.spent; });
    var pct = tb ? Math.min(100, Math.round(ts / tb * 100)) : 0;
    h += '<div class="hero"><div class="l">اليوم تقدر تصرف من الصرف الحر</div><div><span class="big">' + approx + fmt(Math.max(0, state.freePerDay)) + '</span><span class="cur">ر.س</span></div>' +
      '<div class="pills"><span class="p1">المتبقي ' + fmt(state.freeLeft) + ' ر.س</span><span class="p2">' + state.daysLeft + ' يوماً متبقية</span></div>' +
      '<div><div class="track"><i style="width:' + pct + '%"></i></div><div class="sub" style="margin-top:6px"><span>صُرف ' + fmt(ts) + ' من ' + fmt(tb) + '</span><span>' + pct + '%</span></div></div></div>';
    h += '<div class="sec"><b>الأسبوعية</b></div>';
    state.weekly.forEach(function (w) {
      h += '<button class="env" onclick="openPay(' + idx(w.name) + ')"><div class="r"><span class="n">' + esc(w.name) + '</span><span class="chip">هذا الأسبوع</span><b>' + fmt(w.perWeek) + ' <span style="font-size:10px;opacity:.75">ر.س</span></b></div></button>';
    });
    h += '<div class="sec"><b>الأظرف</b></div>';
    state.envelopes.forEach(function (e, i) {
      if (e.type !== 'متغير') return;
      h += '<button class="env" onclick="openPay(' + i + ')"><div class="r"><span class="n">' + esc(e.name) + '</span><span class="chip">' + esc(e.account) + '</span><b style="color:' + color(e) + '">' + fmt(e.left) + ' <span style="font-size:10px;opacity:.75">ر.س</span></b></div><div class="bar"><i style="width:' + Math.min(100, Math.round(e.pct * 100)) + '%;background:' + color(e) + '"></i></div></button>';
    });
  } else if (view === 'log') {
    h += '<div class="sec"><b>آخر العمليات</b></div>';
    if (!recent.length) h += '<div style="color:var(--mute)">لا توجد عمليات بعد.</div>';
    recent.forEach(function (t) {
      h += '<div class="tx"><div><b>' + esc(t.envelope) + '</b><div style="font-size:12px;color:var(--mute)">' + esc(t.date) + ' ' + esc(t.time) + (t.note ? ' · ' + esc(t.note) : '') + (t.type === 'طارئ' ? ' · طارئ' : '') + '</div></div><b style="flex-grow:0">' + fmt(t.amount) + '</b></div>';
    });
  } else if (view === 'rep') {
    if (!rep) h += '<div style="color:var(--mute)">جاري التحميل…</div>';
    else {
      var sc = rep.score, sl = sc >= 85 ? 'ممتاز' : sc >= 65 ? 'جيد' : 'يحتاج انتباه';
      h += '<div class="hero"><div class="l">درجة الدورة</div><div><span class="big">' + sc + '</span><span class="cur">من 100 · ' + sl + '</span></div><div class="track"><i style="width:' + sc + '%"></i></div></div>';
      h += '<div class="box"><div class="rw"><span>ميزانية المتغير</span><b>' + fmt(rep.budgetVar) + '</b></div><div class="rw"><span>المصروف</span><b>' + fmt(rep.spentVar) + '</b></div><div class="rw"><span>المتبقي</span><b style="color:var(--green)">' + fmt(rep.budgetVar - rep.spentVar) + '</b></div><div class="rw"><span>للادخار هذي الدورة</span><b>' + fmt(rep.savings) + '</b></div>' + (rep.income ? '<div class="rw"><span>دخل إضافي</span><b>' + fmt(rep.income) + '</b></div>' : '') + '</div>';
      h += '<div class="sec"><b>الأظرف</b></div>';
      rep.envelopes.forEach(function (e) {
        if (e.type !== 'متغير') return;
        h += '<div class="env" style="cursor:default"><div class="r"><span class="n">' + esc(e.name) + '</span><span class="chip">' + fmt(e.spent) + ' من ' + fmt(e.budget) + '</span></div><div class="bar"><i style="width:' + Math.min(100, Math.round(e.pct * 100)) + '%;background:' + color(e) + '"></i></div></div>';
      });
      if (rep.pending.length) {
        h += '<div class="sec"><b>استلاف معلّق</b></div>';
        rep.pending.forEach(function (p) { h += '<div class="banner">' + esc(p.to) + ' استلف ' + fmt(p.amount) + ' من ' + esc(p.from) + '. يُسوّى يوم الراتب.</div>'; });
      }
      h += '<div class="sec"><b>القروض</b></div>';
      rep.loans.forEach(function (l) {
        var pc = l.total ? Math.round(l.paid / l.total * 100) : 0;
        h += '<div class="env" style="cursor:default"><div class="r"><span class="n">' + esc(l.name) + '</span><span class="chip">' + l.paid + ' من ' + l.total + '</span><b>' + fmt(l.rest) + '</b></div><div class="bar"><i style="width:' + pc + '%;background:var(--gold)"></i></div></div>';
      });
    }
  } else if (view === 'payday') {
    h += '<div class="sec"><b>يوم الراتب</b></div><div class="hero"><div class="l">حوّل كل مبلغ من حساب الراتب ثم علّم عليه. التسوية محسوبة تلقائياً.</div></div>';
    if (!payday.length) h += '<div style="color:var(--mute)">جاري التحميل…</div>';
    payday.forEach(function (p) {
      h += '<div class="opt' + (p.done ? ' sel' : '') + '" onclick="togglePay(' + p.row + ',' + (!p.done) + ')"><div style="flex-grow:1"><b>' + esc(p.envelope) + '</b><div style="font-size:12px;color:var(--mute)">' + esc(p.account) + (p.adj ? ' · تسوية ' + (p.adj > 0 ? '+' : '') + fmt(p.adj) : '') + '</div></div><b>' + fmt(p.amount) + '</b><span style="font-size:20px">' + (p.done ? '✓' : '○') + '</span></div>';
    });
    h += '<button class="ghost" onclick="tab(\'more\')">رجوع</button>';
  } else if (view === 'recon') {
    h += '<div class="sec"><b>مطابقة الأرصدة</b></div><div class="hero"><div class="l">أول مرة: سجّل «رصيد البداية» لكل حساب. بعدها كل أسبوع اضغط «فحص» وقارن.</div></div>';
    if (!accs.length) h += '<div style="color:var(--mute)">جاري التحميل…</div>';
    accs.forEach(function (a, i) {
      h += '<div class="box"><div class="rw"><b>' + esc(a.account) + '</b>' + (a.expected != null ? '<span class="chip">المتوقع ' + fmt(a.expected) + '</span>' : '<span class="chip">بلا بداية</span>') + '</div>' +
        (a.last ? '<div style="font-size:12px;color:' + (Math.abs(a.last.diff) < 1 ? 'var(--green)' : 'var(--red)') + '">آخر فحص ' + esc(a.last.date) + ': الفرق ' + fmt(a.last.diff) + '</div>' : '') +
        '<input class="note rb" data-a="' + esc(a.account) + '" type="number" inputmode="decimal" placeholder="الرصيد الفعلي من البنك"></div>';
    });
    h += '<button class="go" onclick="saveRecon(\'open\')">سجّل كرصيد بداية</button><button class="ghost" onclick="saveRecon(\'check\')">فحص ومقارنة</button><button class="ghost" onclick="tab(\'more\')">رجوع</button>';
  } else {
    h += '<div class="sec"><b>أدوات</b></div><button class="env" onclick="tab(\'payday\')"><div class="r"><span class="n">يوم الراتب</span><span class="chip">قائمة التحويلات</span></div></button><button class="env" onclick="tab(\'recon\')"><div class="r"><span class="n">مطابقة الأرصدة</span><span class="chip">أسبوعياً</span></div></button>';
    h += '<div class="sec"><b>الإشعارات</b></div><div class="hero"><div class="l">الصق رابط خدمة الإشعارات ثم فعّلها. تعمل من التطبيق على الشاشة الرئيسية فقط.</div><input id="pushurl" class="note" style="direction:ltr;text-align:left" placeholder="https://...workers.dev" value="' + esc(lsGet('zarf_push') || '') + '"><button class="go" onclick="enablePush()">تفعيل الإشعارات</button></div>';
    h += '<div class="sec"><b>دخل إضافي</b></div><div class="hero"><div class="l">يُقسم تلقائياً: 50% أبيان للاستثمار و50% الإنماء ادخار.</div><input id="isrc" class="note" placeholder="المصدر (تصوير، دعم، ...)"><input id="iamt" class="note" type="number" inputmode="decimal" placeholder="المبلغ"><button class="go" onclick="addIncome()">سجّل الدخل</button></div>';
    h += '<div class="sec"><b>المزيد</b></div><div class="hero"><div class="l">العمليات المحفوظة على الجوال: ' + queue().length + '</div><button class="ghost" onclick="load()">تحديث</button><button class="ghost" onclick="lsSet(\'zarf_token\',\'\');token=null;setup()">تغيير الرمز السري</button></div>';
    h += '<div class="sec"><b>الأظرف المحوَّلة</b></div>';
    state.envelopes.forEach(function (e) {
      if (e.type === 'متغير') return;
      h += '<div class="env" style="cursor:default"><div class="r"><span class="n">' + esc(e.name) + '</span><span class="chip">' + esc(e.account) + '</span><b>' + fmt(e.budget) + '</b></div></div>';
    });
  }
  $('main').innerHTML = h;
}

var rep = null, payday = [], accs = [];
function togglePay(row, done) {
  payday.forEach(function (p) { if (p.row === row) p.done = done; });
  render();
  post({ action: 'paydayDone', row: row, done: done }).catch(function () { toast('تعذّر الحفظ'); });
}
function saveRecon(kind) {
  var b = {};
  document.querySelectorAll('.rb').forEach(function (i) { if (i.value !== '') b[i.getAttribute('data-a')] = i.value; });
  if (!Object.keys(b).length) { toast('اكتب رصيداً واحداً على الأقل'); return; }
  post({ action: 'recon', kind: kind, balances: b }).then(function (r) {
    if (!r.ok) throw new Error(r.error); accs = r.data; toast('تم الحفظ'); render();
  }).catch(function (e) { toast(e.message || 'تعذّر الحفظ'); });
}

/* ---------- شاشة قبل ما أدفع ---------- */
var payI = 0, payType = 'صرف', amtS = '', lender = null, busy = false;
function openPay(i, type) {
  if (!state) return;
  if (i == null || i < 0) i = idx('المقاضي');
  payI = i; payType = type || 'صرف'; amtS = ''; lender = null; busy = false;
  renderPay(); $('pay').classList.add('on');
}
function closePay() { $('pay').classList.remove('on'); }
function pickEnv(i, t) { payI = i; payType = t || 'صرف'; lender = null; renderPay(); }
function key(k) {
  if (k === 'del') amtS = amtS.slice(0, -1);
  else if (k === '.') { if (amtS.indexOf('.') < 0) amtS = (amtS || '0') + '.'; }
  else if (amtS.length < 8) amtS += k;
  lender = null; renderPay();
}
function pickLender(n) { lender = n; renderPay(); }

function renderPay() {
  var e = state.envelopes[payI], a = Number(amtS) || 0, emer = payType === 'طارئ';
  var after = e.left - a;
  var h = '<div class="ph"><button class="x" aria-label="إغلاق" onclick="closePay()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div style="flex-grow:1;font-size:18px;font-weight:800">قبل ما أدفع</div></div>';
  h += '<div class="chips">';
  state.envelopes.forEach(function (x, i) {
    if (x.type !== 'متغير') return;
    h += '<button class="cp' + (i === payI && !emer ? ' on' : '') + '" onclick="pickEnv(' + i + ')">' + esc(x.name) + '</button>';
  });
  h += '<button class="cp' + (emer ? ' on' : '') + '" onclick="pickEnv(' + idx('الاحتياطي') + ',\'طارئ\')">طارئ</button></div>';
  h += '<div class="amt"><div style="font-size:12px;color:var(--dim);font-weight:600">المبلغ</div><div class="a">' + (amtS || '0') + '<span style="font-size:18px;color:var(--gold);margin-inline-start:8px">SAR</span></div></div>';
  var good = after >= 0;
  var w1 = e.budget ? Math.max(0, Math.min(100, e.left / e.budget * 100)) : 0;
  var w2 = e.budget ? Math.max(0, Math.min(w1, a / e.budget * 100)) : 0;
  h += '<div class="box"><div class="rw"><span style="color:var(--mute)">المتبقي الآن في «' + esc(e.name) + '»</span><b>' + fmt(e.left) + ' ر.س</b></div>' +
    '<div class="bar" style="height:8px;display:flex"><div style="width:' + (w1 - w2) + '%;background:rgba(61,220,151,.45)"></div><div style="width:' + w2 + '%;background:' + (good ? 'var(--green)' : 'var(--red)') + '"></div></div>' +
    '<div class="rw"><span style="color:var(--mute)">بعد هذا الدفع</span><b style="color:' + (good ? 'var(--green)' : 'var(--red)') + '">' + fmt(after) + ' ر.س</b></div></div>';
  h += '<div class="acc"><div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-6 9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/></svg></div><div style="flex-grow:1"><div style="font-size:12px;color:var(--mute)">ادفع من حساب</div><div style="font-size:17px;font-weight:800">' + esc(e.account) + '</div></div><span style="font-size:11px;font-weight:700;color:var(--gold)">ظرف ' + esc(e.name) + '</span></div>';
  if (a > e.left && a > 0 && !emer) {
    var need = a - e.left;
    var opts = state.envelopes.filter(function (x) { return x.lendable && x.name !== e.name && x.left >= need; });
    h += '<div class="warn"><b>رصيد «' + esc(e.name) + '» لا يكفي.</b><div style="font-size:13px;color:var(--mute)">ينقصك ' + fmt(need) + '. تقدر تستلف من ظرف آخر، ويُسوّى في دورة الراتب القادمة.</div>';
    if (!opts.length) h += '<div style="font-size:13px;color:var(--mute)">لا يوجد ظرف يكفي للاستلاف.</div>';
    opts.forEach(function (x) { h += '<div class="opt' + (lender === x.name ? ' sel' : '') + '" onclick="pickLender(\'' + esc(x.name) + '\')"><b style="flex-grow:1">' + esc(x.name) + '</b><span style="font-size:12px;color:var(--mute)">متاح ' + fmt(x.left) + '</span></div>'; });
    h += '</div>';
  }
  h += '<input class="note" id="note" placeholder="ملاحظة (اختياري)" value="' + esc(window._note || '') + '" oninput="window._note=this.value">';
  h += '<div class="keys">';
  ['1', '2', '3', '4', '5', '6', '7', '8', '9', '.', '0'].forEach(function (k) { h += '<button onclick="key(\'' + k + '\')">' + k + '</button>'; });
  h += '<button onclick="key(\'del\')" style="font-size:15px">حذف</button></div>';
  h += '<button class="go" id="go" onclick="submitTx()">تأكيد وتسجيل الدفعة</button>';
  $('payin').innerHTML = h;
}

function submitTx() {
  if (busy) return;
  var e = state.envelopes[payI], a = Number(amtS), emer = payType === 'طارئ';
  if (!(a > 0)) { toast('اكتب المبلغ'); return; }
  var short = !emer && a > e.left;
  if (short && !lender) { toast('اختر ظرفاً للاستلاف منه'); return; }
  busy = true; $('go').disabled = true; $('go').textContent = '...';
  var note = window._note || '';
  var steps = Promise.resolve();
  if (short) steps = post({ action: 'borrow', from: lender, to: e.name, amount: a - e.left }).then(function (r) { if (!r.ok) throw new Error(r.error); });
  var body = { action: 'add', envelope: e.name, amount: a, note: note, type: payType, date: today() };
  steps.then(function () { return post(body); }).then(function (r) {
    if (!r.ok) throw new Error(r.error);
    state = r.data; lsSet('zarf_state', JSON.stringify(state));
    window._note = ''; closePay(); render(); toast('تم التسجيل');
  }).catch(function (err) {
    busy = false;
    if (!short && (!navigator.onLine || /fetch|network|Failed/i.test(String(err)))) {
      var q = queue(); q.push(body); saveQ(q); window._note = ''; closePay(); toast('محفوظ على الجوال، يُرفع عند عودة الإنترنت'); return;
    }
    $('go').disabled = false; $('go').textContent = 'تأكيد وتسجيل الدفعة'; toast(err.message || 'تعذّر التسجيل');
  });
}

function addIncome() {
  var a = Number($('iamt').value);
  if (!(a > 0)) { toast('اكتب المبلغ'); return; }
  post({ action: 'income', amount: a, source: $('isrc').value, date: today() }).then(function (r) {
    if (!r.ok) throw new Error(r.error || 'تعذّر التسجيل');
    toast('أبيان ' + fmt(r.split.abyan) + ' · الإنماء ادخار ' + fmt(r.split.alinma));
    $('iamt').value = ''; $('isrc').value = '';
  }).catch(function (e) { toast(e.message || 'تعذّر التسجيل'); });
}

/* أيقونة الشاشة الرئيسية: تُرسم بخط الكوفي */
function makeIcon() {
  try {
    var c = document.createElement('canvas'); c.width = 180; c.height = 180;
    var x = c.getContext('2d');
    x.fillStyle = '#0B2545'; x.fillRect(0, 0, 180, 180);
    x.fillStyle = '#FBF9F4'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.direction = 'rtl';
    x.font = '700 92px "Reem Kufi", sans-serif';
    x.fillText('ظرف', 90, 98);
    document.querySelector('link[rel="apple-touch-icon"]').href = c.toDataURL('image/png');
  } catch (e) {}
}
if (document.fonts && document.fonts.load) { document.fonts.load('700 92px "Reem Kufi"', 'ظرف').then(makeIcon, makeIcon); } else { makeIcon(); }

/* الإشعارات */
var VAPID_PUBLIC = 'BAni54Bs4rTxft3VLprWUzj3qJuIP_24ytp4oIz5CelMPVT6h-BU3VoEwQEVh3Lzun4U9CQkWXFNhW-9jl0TWqg';
function urlB64ToU8(b) { var p = '='.repeat((4 - b.length % 4) % 4), s = (b + p).replace(/-/g, '+').replace(/_/g, '/'), r = atob(s), a = new Uint8Array(r.length); for (var i = 0; i < r.length; i++) a[i] = r.charCodeAt(i); return a; }
function enablePush() {
  var url = ($('pushurl').value || '').trim().replace(/\/$/, '');
  if (!url) { toast('الصق رابط الإشعارات'); return; }
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) { toast('أضف التطبيق للشاشة الرئيسية أولاً ثم افتحه منها'); return; }
  lsSet('zarf_push', url);
  Notification.requestPermission().then(function (perm) {
    if (perm !== 'granted') throw new Error('لم تسمح بالإشعارات');
    return navigator.serviceWorker.ready;
  }).then(function (reg) {
    return reg.pushManager.getSubscription().then(function (s) { return s || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToU8(VAPID_PUBLIC) }); });
  }).then(function (sub) {
    return caches.open('zarf-cfg').then(function (c) {
      return c.put('https://zarf.local/cfg', new Response(JSON.stringify({ push: url, token: token })));
    }).then(function () {
      return fetch(url + '/subscribe', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: token, sub: sub.toJSON() }) });
    });
  }).then(function (r) { return r.json(); }).then(function (j) {
    if (!j.ok) throw new Error('رفض الخادم الاشتراك');
    toast('تم تفعيل الإشعارات');
  }).catch(function (e) { toast(e.message || 'تعذّر التفعيل'); });
}

window.addEventListener('online', flush);
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
load();
</script>
</body>
